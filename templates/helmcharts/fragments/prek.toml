
[[repos]]
repo = "local"

[[repos.hooks]]
id = "helm-lint"
name = "helm lint"
entry = "mise run --quiet helmcharts:lint"
language = "system"
files = "^charts/"
pass_filenames = false

[[repos]]
repo = "local"

[[repos.hooks]]
id = "checkov"
name = "checkov"
entry = "checkov --config-file .checkov.yaml"
language = "system"
files = "^charts/"
pass_filenames = false
