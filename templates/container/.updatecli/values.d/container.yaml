---
miseDeps:
  container:
    - slug: hadolint
      answerKey: hadolint_version
      tomlKey: hadolint
      kind: githubrelease
      owner: hadolint
      repo: hadolint
      trimPrefix: true
      file: .mise/conf.d/20-container.toml
    - slug: dockerfmt
      answerKey: dockerfmt_version
      tomlKey: '"github:reteps/dockerfmt"'
      kind: githubrelease
      owner: reteps
      repo: dockerfmt
      trimPrefix: true
      file: .mise/conf.d/20-container.toml

dockerfileDeps: []
