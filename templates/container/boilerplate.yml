---
required_version: ">= 0.16.0"

variables:
  - name: hadolint_version
    description: hadolint version for mise to install
    default: "2.15.1"

  - name: dockerfmt_version
    description: dockerfmt (Dockerfile formatter) version for mise to install
    default: "0.5.4"

skip_files:
  - path: "fragments"
    if: "true"
  - path: "fragments/*"
    if: "true"

hooks:
  after:
    - command: sh
      dir: "{{ outputFolder }}"
      args:
        - -c
        - 'printf "%s\n---\n" "$ANSWERS" >>.boilerplate-answers.parts'
      env:
        ANSWERS: '{{ omit . "This" "BoilerplateConfigVars" "BoilerplateConfigDeps" "__each__" | toYaml }}'
