---
name: Release container image

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions: {}

jobs:
  publish:
    if: ${{ "{{" }} github.event.workflow_run.conclusion == 'success' {{ "}}" }}
    runs-on: ubuntu-{{ .runner_ubuntu_version }}
    container:
      image: ghcr.io/aacebedo/devcontainer-base:{{ .devcontainer_image_version }}
      options: --user root --privileged --cgroupns=host --security-opt apparmor=unconfined --device /dev/fuse
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@{{ .checkout_action_version }}
        with:
          persist-credentials: false
          token: ${{ "{{" }} secrets.GITHUB_TOKEN {{ "}}" }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Find the released version
        id: version
        shell: bash
        run: |
          # The Release run only bumps when there is something to release; its version commit is then the tagged head of
          # the default branch.
          if tag="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
            echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          else
            echo "No new release tag on $(git rev-parse --short HEAD); nothing to publish."
          fi
      - name: Build and scan the container image
        if: steps.version.outputs.tag != ''
        run: mise run container:run:security-scan
      - name: Publish the container image
        if: steps.version.outputs.tag != ''
        run: mise run container:publish "${VERSION#v}"
        env:
          VERSION: ${{ "{{" }} steps.version.outputs.tag {{ "}}" }}
          REGISTRY_USERNAME: ${{ "{{" }} github.actor {{ "}}" }}
          REGISTRY_PASSWORD: ${{ "{{" }} secrets.GITHUB_TOKEN {{ "}}" }}
