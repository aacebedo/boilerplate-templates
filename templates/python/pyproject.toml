{{- $python := "3.14.7" -}}
[project]
name = "{{ .package_name }}"
version = "{{ .package_version }}"
requires-python = ">={{ regexFind "^[0-9]+[.][0-9]+" $python }}"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.ruff]
line-length = 120
target-version = "py{{ regexFind "^[0-9]+[.][0-9]+" $python | replaceAll "." "" }}"

[tool.ruff.lint]
select = ["E", "F", "I"]
