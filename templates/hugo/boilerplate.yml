---
required_version: ">= 0.16.0"

variables:
  - name: site_title
    description: Site title, rendered in <title> and used as the RSS feed name
    type: string
    default: "My Site"
    confirm: true
    order: 0

  - name: base_url
    description: Canonical base URL of the published site, with a trailing slash
    type: string
    default: "https://example.com/"
    confirm: true
    order: 1
    validations:
      - url

  - name: hugo_version
    description: Hugo (extended) version for mise to install
    default: "0.166.0"

  - name: go_version
    description: Go version for mise to install, used by Hugo modules
    default: "1.27.1"

  - name: node_version
    description: Node.js version for mise to install, used by the Lighthouse test
    default: "26.10.0"

  - name: djlint_version
    description: djlint version for mise to install
    default: "1.46.2"

  - name: dprint_gofumpt_version
    description: gofumpt (Go) dprint plugin version, pinned in .dprint/hugo.json
    default: "0.0.18"

  - name: dprint_typescript_version
    description: dprint TypeScript/JavaScript plugin version, pinned in .dprint/hugo.json
    default: "0.96.1"

  - name: dprint_malva_version
    description: Malva (CSS) dprint plugin version, pinned in .dprint/hugo.json
    default: "0.16.0"

  - name: dprint_markup_fmt_version
    description: markup_fmt (HTML) dprint plugin version, pinned in .dprint/hugo.json
    default: "0.27.3"

  - name: lighthouse_version
    description: Lighthouse version used by the smoke test
    default: "13.5.0"

  - name: puppeteer_version
    description: Puppeteer version used by the smoke test to drive Chrome
    default: "25.11.0"

skip_files:
  - path: "fragments"
    if: "true"
  - path: "fragments/*"
    if: "true"

hooks:
  after:
    - command: sh
      dir: "{{ outputFolder }}"
      args:
        - -c
        - 'printf "%s\n---\n" "$ANSWERS" >>.boilerplate-answers.parts'
      env:
        ANSWERS: '{{ omit . "This" "BoilerplateConfigVars" "BoilerplateConfigDeps" "__each__" | toYaml }}'
