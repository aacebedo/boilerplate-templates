---
miseDeps:
  hugo:
    - slug: go
      answerKey: go_version
      tomlKey: go
      kind: githubrelease
      owner: golang
      repo: go
      trimPrefix: false
      versionfilterRegex: '^go(\d+\.\d+\.\d+)$'
      file: .mise/conf.d/10-hugo.toml
    - slug: hugoExtended
      answerKey: hugo_version
      tomlKey: hugo-extended
      kind: githubrelease
      owner: gohugoio
      repo: hugo
      trimPrefix: true
      file: .mise/conf.d/10-hugo.toml
    - slug: node
      answerKey: node_version
      tomlKey: node
      kind: githubrelease
      owner: nodejs
      repo: node
      trimPrefix: false
      versionfilterRegex: '^v(26\.\d+\.\d+)$'
      file: .mise/conf.d/10-hugo.toml
    - slug: djlint
      answerKey: djlint_version
      tomlKey: '"pipx:djlint"'
      kind: pypi
      name: djlint
      trimPrefix: false
      file: .mise/conf.d/10-hugo.toml

npmDeps:
  - slug: lighthouse
    answerKey: lighthouse_version
    answersFile: .boilerplate-answers.yaml
    packageName: lighthouse
    file: tests/package.json
  - slug: puppeteer
    answerKey: puppeteer_version
    answersFile: .boilerplate-answers.yaml
    packageName: puppeteer
    file: tests/package.json

dprintPlugins:
  hugo:
    - slug: gofumpt
      answerKey: dprint_gofumpt_version
      owner: jakebailey
      repo: dprint-plugin-gofumpt
      urlPrefix: jakebailey/gofumpt-v
      file: .dprint/hugo.json
    - slug: typescript
      answerKey: dprint_typescript_version
      owner: dprint
      repo: dprint-plugin-typescript
      urlPrefix: typescript-
      file: .dprint/hugo.json
    - slug: malva
      answerKey: dprint_malva_version
      owner: g-plane
      repo: malva
      urlPrefix: g-plane/malva-v
      file: .dprint/hugo.json
    - slug: markupFmt
      answerKey: dprint_markup_fmt_version
      owner: g-plane
      repo: markup_fmt
      urlPrefix: g-plane/markup_fmt-v
      file: .dprint/hugo.json
