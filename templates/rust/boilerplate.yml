---
# Layer rendered by the base template when "rust" is listed in its layers.
required_version: ">= 0.16.0"

variables:
  - name: crate_name
    description: Rust crate/package name
    type: string
    default: "my-crate"
    confirm: true
    order: 0

  - name: rust_edition
    description: Rust edition
    type: enum
    options:
      - "2021"
      - "2024"
    default: "2024"
    confirm: true
    order: 1

  - name: crate_version
    description: Initial version of the crate in Cargo.toml
    type: string
    default: "0.1.0"
    order: 2

  - name: rust_version
    description: Rust toolchain version for mise to install
    default: "1.98.1"

skip_files:
  # Injected into the base files by the base template instead.
  - path: "fragments"
    if: "true"
  - path: "fragments/*"
    if: "true"

hooks:
  after:
    # The base template merges this into .boilerplate-answers.yaml once every layer ran.
    - command: sh
      dir: "{{ outputFolder }}"
      args:
        - -c
        - 'printf "%s\n---\n" "$ANSWERS" >>.boilerplate-answers.parts'
      env:
        # Every variable this layer resolved (the inherited base ones included), minus
        # Boilerplate's own bookkeeping.
        ANSWERS: '{{ omit . "This" "BoilerplateConfigVars" "BoilerplateConfigDeps" "__each__" | toYaml }}'
