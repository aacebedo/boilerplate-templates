---
required_version: ">= 0.16.0"

variables:
  - name: crate_name
    description: Rust crate/package name
    type: string
    default: "my-crate"
    confirm: true
    order: 0

  - name: rust_edition
    description: Rust edition
    type: enum
    options:
      - "2021"
      - "2024"
    default: "2024"
    confirm: true
    order: 1

  - name: crate_version
    description: Initial version of the crate in Cargo.toml
    type: string
    default: "0.1.0"
    order: 2

skip_files:
  - path: "fragments"
    if: "true"
  - path: "fragments/*"
    if: "true"

hooks:
  after:
    - command: sh
      dir: "{{ outputFolder }}"
      args:
        - -c
        - 'printf "%s\n---\n" "$ANSWERS" >>.boilerplate-answers.parts'
      env:
        ANSWERS: '{{ omit . "This" "BoilerplateConfigVars" "BoilerplateConfigDeps" "__each__" | toYaml }}'
