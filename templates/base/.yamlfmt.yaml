---
doublestar: true
gitignore_excludes: true
include:
  - "**/*.{yaml,yml}"
exclude:
  - "**/.updatecli/manifests/**"
  - ".boilerplate-answers.yaml"
{{ template "fragments" (dict "vars" . "name" "yamlfmt-exclude.yaml") -}}
formatter:
  type: basic
  indent: 2
  include_document_start: true
  retain_line_breaks_single: true
  pad_line_comments: 1
  scan_folded_as_literal: true
