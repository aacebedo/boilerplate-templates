---
required_version: ">= 0.16.0"

variables:
  - name: project_name
    description: >-
      Human-readable project name. There's no smart default derived from the output folder, so please type the real
      name.
    type: string
    default: "My Project"
    confirm: true
    order: 0

  - name: project_slug
    description: >-
      Slug used in image names, URLs, etc. Derived from the project name, lowercased with spaces replaced by dashes.
    type: string
    default: "my-project"
    confirm: true
    order: 1

  - name: project_description
    description: One-line project description
    type: string
    default: ""
    confirm: true
    order: 2

  - name: github_owner
    description: >-
      GitHub organization or user that owns the repository, also the copyright holder written into REUSE.toml (and
      LICENSE, for MIT)
    type: string
    order: 3
    validations:
      - required

  - name: license
    description: >-
      SPDX identifier of the project's license (e.g. Apache-2.0, MIT, MPL-2.0, GPL-3.0-or-later). Required, with no
      default: licensing is a deliberate choice. Its text is downloaded from SPDX into LICENSE and LICENSES/ (needs
      network), REUSE.toml puts every file under it unless it carries its own SPDX header, and `reuse lint` is wired
      into prek.
    type: string
    order: 4
    validations:
      - required

  - name: layers
    description: >-
      Layers to stack on top of the base tooling, comma separated, e.g. "rust,container". Each one is a sibling template
      directory: container, helmcharts, hugo, python, rust.
    type: string
    default: ""
    confirm: true
    order: 5

  # --- Tools installed by mise (.mise/conf.d/00-base.toml) ---

  - name: shellcheck_version
    description: shellcheck version for mise to install
    default: "0.11.0"

  - name: editorconfig_checker_version
    description: editorconfig-checker version for mise to install
    default: "4.0.2"

  - name: trivy_version
    description: Trivy version for mise to install
    default: "0.74.0"

  - name: ryl_version
    description: ryl (YAML linter) version for mise to install
    default: "0.22.0"

  - name: prek_version
    description: prek version for mise to install
    default: "0.5.3"

  - name: shfmt_version
    description: shfmt version for mise to install
    default: "3.14.1"

  - name: dprint_version
    description: dprint version for mise to install
    default: "0.57.4"

  - name: tombi_version
    description: Tombi version for mise to install
    default: "1.5.5"

  - name: cocogitto_version
    description: Cocogitto version for mise to install
    default: "7.0.0"

  - name: gh_version
    description: GitHub CLI version for mise to install
    default: "2.101.0"

  - name: rumdl_version
    description: rumdl version for mise to install
    default: "0.2.77"

  - name: updatecli_version
    description: Updatecli version for mise to install
    default: "0.121.0"

  - name: biome_version
    description: Biome version for mise to install, also used for the .biome.json schema URL
    default: "2.5.14"

  - name: codebook_version
    description: Codebook version for mise to install
    default: "0.3.42"

  - name: uv_version
    description: uv version for mise to install, also used by mise to install the pipx:* tools
    default: "0.12.19"

  - name: reuse_version
    description: REUSE tool version for mise to install
    default: "6.2.0"

  - name: boilerplate_version
    description: Boilerplate version for mise to install, used to apply and update the templates
    default: "0.16.0"

  - name: yq_version
    description: yq version for mise to install, used to read and write the answers file
    default: "4.53.6"

  # --- CI (the container image the jobs run in) ---

  - name: devcontainer
    description: >-
      Whether the project gets a devcontainer and its CI jobs run in ghcr.io/aacebedo/devcontainer-base. Turn it off for
      a project that devcontainer-base itself depends on, such as devcontainer-base.
    type: bool
    default: true

  - name: devcontainer_image_version
    description: >-
      Tag of ghcr.io/aacebedo/devcontainer-base, used by the devcontainer and by the CI jobs so both run in the same
      environment
    default: "1.24.1"

partials:
  - "_partials/*.tmpl"

dependencies:
  - name: container
    template-url: "../container"
    output-folder: "."
    skip: '{{ not (has "container" (splitList "," .layers)) }}'
  - name: helmcharts
    template-url: "../helmcharts"
    output-folder: "."
    skip: '{{ not (has "helmcharts" (splitList "," .layers)) }}'
  - name: hugo
    template-url: "../hugo"
    output-folder: "."
    skip: '{{ not (has "hugo" (splitList "," .layers)) }}'
  - name: python
    template-url: "../python"
    output-folder: "."
    skip: '{{ not (has "python" (splitList "," .layers)) }}'
  - name: rust
    template-url: "../rust"
    output-folder: "."
    skip: '{{ not (has "rust" (splitList "," .layers)) }}'

skip_files:
  - path: "_partials"
    if: "true"
  - path: "_partials/*"
    if: "true"
  - path: ".devcontainer"
    if: "{{ not .devcontainer }}"
  - path: ".devcontainer/*"
    if: "{{ not .devcontainer }}"

hooks:
  after:
    - command: sh
      dir: "{{ outputFolder }}"
      args:
        - -c
        - |
          set -e
          answers=.boilerplate-answers.yaml
          parts=.boilerplate-answers.parts
          # The checkout Boilerplate rendered from carries the version it was fetched at: the release tag when HEAD is
          # on one, else the commit, both of which go straight into a ?ref=. Only the repository is recorded alongside
          # it - the tasks know the templates/base entry point inside it.
          ref="$(git -C "$TEMPLATE_FOLDER" describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -z "$ref" ]; then
            ref="$(git -C "$TEMPLATE_FOLDER" rev-parse HEAD 2>/dev/null || true)"
          fi
          root="$(git -C "$TEMPLATE_FOLDER" rev-parse --show-toplevel 2>/dev/null || true)"
          url=""
          if [ -z "$root" ]; then
            :
          elif [ "${root#*/boilerplate-cache}" != "$root" ]; then
            # go-getter fetched the templates into a throwaway clone, which says nothing once it is gone: record the
            # remote it pulled them from instead. That is whichever one the clone carries, not necessarily "origin".
            remote="$(git -C "$root" remote 2>/dev/null | grep -qx origin && echo origin \
              || git -C "$root" remote 2>/dev/null | head -n 1)"
            if [ -n "$remote" ]; then
              url="$(git -C "$root" remote get-url "$remote" 2>/dev/null || true)"
            fi
          else
            # Rendered from a checkout on this machine: that directory is the repository, and it stays put, so record it
            # as it is rather than where it came from.
            url="$root"
            if [ "$url" = "$(pwd -P)" ]; then
              url="."
            fi
          fi
          { printf '%s\n' "$ANSWERS"
            if [ -f "$parts" ]; then printf -- '---\n'; cat "$parts"; fi
          } >"$parts.all"
          printf '%s\n' \
            '# The answers the Boilerplate templates were applied with, and the template' \
            '# version they were rendered from. Rewritten by "mise run update-templates".' \
            '---' >"$answers"
          URL="$url" REF="$ref" mise x -- yq ea '. as $a ireduce ({}; . * $a) | sort_keys(.) |
            {"template_url": strenv(URL), "template_ref": strenv(REF)} * .' "$parts.all" >>"$answers"
          rm -f "$parts" "$parts.all"
      env:
        TEMPLATE_FOLDER: "{{ templateFolder }}"
        ANSWERS: '{{ omit . "This" "BoilerplateConfigVars" "BoilerplateConfigDeps" "__each__" | toYaml }}'

    - command: sh
      dir: "{{ outputFolder }}"
      args:
        - -c
        - |
          set -e
          if [ ! -s LICENSE ]; then
            mise x -- reuse download -o LICENSE "$LICENSE_ID"
            HOLDER="$(date +%Y) $COPYRIGHT_HOLDER" awk -v p="<year> <copyright holders>" \
              '(i = index($0, p)) { $0 = substr($0, 1, i - 1) ENVIRON["HOLDER"] substr($0, i + length(p)) } 1' \
              LICENSE >LICENSE.tmp && mv LICENSE.tmp LICENSE || { rm -f LICENSE.tmp; exit 1; }
          fi
          mise x -- reuse download --all
      env:
        LICENSE_ID: "{{ .license }}"
        COPYRIGHT_HOLDER: "{{ .github_owner }}"
