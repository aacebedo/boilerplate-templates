---
name: Update dependencies

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
permissions: {}
jobs:
  update-deps:
    runs-on: ubuntu-{{ .runner_ubuntu_version }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@{{ .checkout_action_version }}
        with:
          persist-credentials: false
          token: ${{ "{{" }} secrets.GITHUB_TOKEN {{ "}}" }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Apply update policies
        run: mise run update-deps --apply
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ "{{" }} secrets.GITHUB_TOKEN {{ "}}" }}
