---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    uses: {{ shell "sh" (printf "%s/_partials/static-files.sh" templateFolder) (env "PWD" "") .layers "github" "reusable-release.yaml" }}
    secrets: inherit
    permissions:
      contents: write
{{ template "fragments" (dict "vars" . "name" "release-job-permissions.yaml") -}}
{{- if .devcontainer }}
    with:
      container-image: ghcr.io/aacebedo/devcontainer-base:1.24.1
      container-options: >-
        --user root
{{ template "fragments" (dict "vars" . "name" "job-container-options.yaml") }}
{{- end -}}
