---
name: PR

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  pr-checks:
    runs-on: ubuntu-{{ .runner_ubuntu_version }}
    container:
      image: ghcr.io/aacebedo/devcontainer-base:{{ .devcontainer_image_version }}
{{ template "fragments" (dict "vars" . "name" "pr-job-container-options.yaml") }}    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@{{ .checkout_action_version }}
        with:
          persist-credentials: false
          token: ${{ "{{" }} secrets.GITHUB_TOKEN {{ "}}" }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
{{ template "fragments" (dict "vars" . "name" "pr-steps.yaml") -}}
