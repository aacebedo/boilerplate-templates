---
name: PR

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  pr-checks:
    uses: ./.github/workflows/reusable-pr-checks.yaml
    permissions:
      contents: read
      packages: read
    with:
      container-image: ghcr.io/aacebedo/devcontainer-base:1.24.1
      container-options: >-
        --user root

      extra-tasks: >-
