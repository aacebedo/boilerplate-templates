---
name: Update dependencies

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: update-deps
  cancel-in-progress: false

jobs:
  update-deps:
    uses: ./.github/workflows/reusable-update-deps.yaml
    permissions:
      contents: read
    secrets: inherit
