---
name: Reusable release

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      container-image:
        description: Image of the container the job runs in, empty to run it on the runner
        type: string
        default: ""
      container-options:
        description: Options of the container the job runs in
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-26.04
    container: >-
      ${{ inputs.container-image != '' && fromJSON(format('{{"image":{0},"options":{1}}}',
      toJSON(inputs.container-image), toJSON(inputs.container-options))) || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout the templates
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .boilerplate-templates
          persist-credentials: false
      - name: Setup
        uses: ./.boilerplate-templates/static_files/github/actions/setup
      - name: Remove the templates checkout
        shell: bash
        run: rm -rf .boilerplate-templates
      - name: Configure git remote and user info
        shell: bash
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin "https://${REPO_OWNER}:${TOKEN}@github.com/${REPO}.git"
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Perform release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
