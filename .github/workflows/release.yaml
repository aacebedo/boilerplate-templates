---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yaml
    permissions:
      contents: write

    with:
      container-image: ghcr.io/aacebedo/devcontainer-base:1.22.0
      container-options: >-
        --user root
