---
name: Release

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yaml
    secrets: inherit
    permissions:
      contents: write

    with:
      container-image: ghcr.io/aacebedo/devcontainer-base:1.25.0
      container-options: >-
        --user root
