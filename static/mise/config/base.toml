[tools]
shellcheck = "0.11.0"
"github:editorconfig-checker/editorconfig-checker" = "4.0.2"
trivy = "0.76.2"
"github:owenlamont/ryl" = "0.30.0"
prek = "0.5.12"
shfmt = "3.14.1"
dprint = "0.65.0"
"github:tombi-toml/tombi" = "1.11.3"
"github:cocogitto/cocogitto" = "7.0.0"
gh = "2.106.0"
rumdl = "0.3.8"
updatecli = "0.125.0"
biome = "2.6.2"
"github:blopker/codebook" = "0.4.1"
uv = "0.13.10"
"pipx:reuse" = { version = "6.3.0", extras = "charset-normalizer" }
boilerplate = "0.17.1"
yq = "4.54.3"

[vars]
# editorconfig-checker-disable
repo_host = '''{{ exec(command="git remote get-url origin 2>/dev/null |
  sed 's/[.]git$//' |
  awk -F'[/:]' '{print $(NF-2)}' |
  sed 's/.*@//' || echo ''") | trim }}'''
repo_owner = '''{{ exec(command="git remote get-url origin 2>/dev/null |
  sed 's/[.]git$//' |
  awk -F'[/:]' '{print $(NF-1)}' || echo ''") | trim }}'''
repo_name = '''{{ exec(command="git remote get-url origin 2>/dev/null |
  sed 's/[.]git$//' |
  awk -F'[/:]' '{print $NF}' || echo ''") | trim }}'''
# editorconfig-checker-enable
repo_url = "https://{{vars.repo_host}}/{{vars.repo_owner}}/{{vars.repo_name}}"
commit_sha = '''{{ exec(command="git rev-parse HEAD 2>/dev/null || echo ''") | trim }}'''

[bootstrap.packages]
"apt:bash" = "latest"
"apt:git" = "latest"
