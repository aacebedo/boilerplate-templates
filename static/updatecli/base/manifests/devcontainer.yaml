---
name: "Bump the devcontainer-base image"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: "{{ .github.branch }}"
      commitusingapi: true
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true

sources:
  devcontainerImage:
    name: "Get latest ghcr.io/aacebedo/devcontainer-base tag"
    kind: dockerimage
    spec:
      image: ghcr.io/aacebedo/devcontainer-base
      tagfilter: '^\d+\.\d+\.\d+$'
      versionfilter:
        kind: semver

conditions:
  devcontainerEnabled:
    name: "The project runs in the devcontainer"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: .boilerplate-answers.yaml
      matchpattern: '(?m)^devcontainer: true$'

targets:
  answers:
    name: "Update devcontainer_image_version in .boilerplate-answers.yaml"
    kind: file
    scmid: default
    sourceid: devcontainerImage
    spec:
      file: .boilerplate-answers.yaml
      matchpattern: '(?m)^(devcontainer_image_version: ).*$'
      replacepattern: '${1}{{ "{{" }} source "devcontainerImage" {{ "}}" }}'
  images:
    name: "Update the devcontainer-base image in the devcontainer and the workflows"
    kind: file
    scmid: default
    sourceid: devcontainerImage
    spec:
      files:
        - .devcontainer/devcontainer.json
        - .github/workflows/pr.yaml
        - .github/workflows/release.yaml
      matchpattern: '(ghcr\.io/aacebedo/devcontainer-base:)[0-9A-Za-z.\-]+'
      replacepattern: '${1}{{ "{{" }} source "devcontainerImage" {{ "}}" }}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): bump the devcontainer-base image to {{ "{{" }} source "devcontainerImage" {{ "}}" }}'
    spec:
      labels:
        - dependencies
