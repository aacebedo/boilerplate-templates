{{- range $i, $dep := .miseDeps }}
{{- if $i }}
---
{{- end }}
{{- $file := ".mise/config.toml" }}
{{- if $dep.file }}{{ $file = $dep.file }}{{ end }}
name: "Bump {{ $dep.slug }} version in {{ $file }}"

scms:
  default:
    kind: github
    spec:
      owner: "{{ $.github.owner }}"
      repository: "{{ $.github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: "{{ $.github.branch }}"
      commitusingapi: true
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true

sources:
  {{ $dep.slug }}:
    name: "Get latest {{ $dep.slug }} release"
    kind: {{ $dep.kind }}
    spec:
  {{- if eq $dep.kind "githubrelease" }}
      owner: {{ $dep.owner }}
      repository: {{ $dep.repo }}
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
    {{- if $dep.versionfilterRegex }}
        kind: regex/semver
        regex: '{{ $dep.versionfilterRegex }}'
        pattern: '*'
    {{- else }}
        kind: semver
    {{- end }}
  {{- else if eq $dep.kind "pypi" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: pep440
  {{- else if eq $dep.kind "npm" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- else if eq $dep.kind "cargopackage" }}
      package: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- end }}
  {{- if or $dep.versionfilterRegex $dep.trimPrefix }}
    transformers:
  {{- if $dep.versionfilterRegex }}
      - findsubmatch:
          pattern: '{{ $dep.versionfilterRegex }}'
          captureindex: 1
  {{- end }}
  {{- if $dep.trimPrefix }}
      - trimprefix: "v"
  {{- end }}
  {{- end }}

targets:
  {{ $dep.slug }}:
    name: "Update {{ $dep.slug }} in {{ $file }}"
    kind: file
    scmid: default
    sourceid: {{ $dep.slug }}
    spec:
      file: {{ $file }}
  {{- if $dep.inlineTable }}
      matchpattern: '(?m)^({{ $dep.tomlKey }} = \{ version = )"[^"]*"'
      replacepattern: '${1}"{{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}"'
  {{- else }}
      matchpattern: '(?m)^{{ $dep.tomlKey }} = ".*"$'
      replacepattern: '{{ $dep.tomlKey }} = "{{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}"'
  {{- end }}

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): bump {{ $dep.slug }} to {{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}'
    spec:
      labels:
        - dependencies
{{- end }}
