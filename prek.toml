exclude = { glob = [
  "templates/*/fragments/**",
  "templates/*/.mise/conf.d/**",
  "static/updatecli/*/manifests/**",
  "templates/base/_partials/*.tmpl",
  "templates/base/.biome.json",
  "templates/base/.codebook.toml",
  "templates/base/.devcontainer/devcontainer.json",
  "templates/base/.dprint.json",
  "templates/base/.github/workflows/pr.yaml",
  "templates/base/.github/workflows/release.yaml",
  "templates/base/.github/workflows/update-deps.yaml",
  "templates/base/.gitignore",
  "templates/base/.ryl.toml",
  "templates/base/.updatecli/values.yaml",
  "templates/base/README.md",
  "templates/base/REUSE.toml",
  "templates/base/cog.toml",
  "templates/base/prek.toml",
  "templates/hugo/src/go.mod",
  "templates/hugo/src/hugo.yaml",
  "templates/hugo/src/layouts/home.html",
  "templates/hugo/tests/package.json",
  "templates/python/pyproject.toml",
  "templates/rust/.rustfmt.toml",
  "templates/rust/Cargo.toml",
] }

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ryl"
name = "ryl"
entry = "ryl --config-file .ryl.toml"
language = "system"
types = ["yaml"]
exclude = '^(\.updatecli|static/updatecli/[^/]+)/manifests/'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "editorconfig-checker"
name = "editorconfig-checker"
entry = "editorconfig-checker"
language = "system"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-lint"
name = "biome lint"
entry = "biome lint --write --files-ignore-unknown=true --no-errors-on-unmatched"
language = "system"
files = '\.(js|jsx|mjs|cjs|ts|tsx|json|jsonc|css|html)$'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "trivy-fs"
name = "trivy filesystem scan"
entry = "trivy"
args = [
  "fs",
  "--scanners",
  "vuln,secret,misconfig,license",
  "--exit-code",
  "1",
  "--severity",
  "CRITICAL",
  "--skip-version-check",
  ".",
]
language = "system"
pass_filenames = false

[[repos]]
repo = "local"

[[repos.hooks]]
id = "dprint"
name = "dprint fmt"
entry = "dprint fmt --config-discovery=ignore-descendants --allow-no-files"
language = "system"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "tombi-lint"
name = "tombi lint"
entry = "tombi lint --offline"
language = "system"
types = ["toml"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "reuse"
name = "reuse lint"
entry = "reuse lint"
language = "system"
pass_filenames = false

[[repos]]
repo = "local"

[[repos.hooks]]
id = "codebook"
name = "codebook spell check"
entry = "codebook-lsp lint"
language = "system"
files = '\.(md|toml|ya?ml|json|jsonc|sh)$|(^|/)Dockerfile$|\.dockerfile$'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-templates"
name = "check the templates are applied"
entry = "mise run --quiet check-templates"
language = "system"
pass_filenames = false
always_run = true

[[repos]]
repo = "local"

[[repos.hooks]]
id = "updatecli-manifest-validate"
name = "validate updatecli manifests"
entry = "env"
args = [
  "UPDATECLI_GITHUB_TOKEN=validate-only",
  "mise",
  "run",
  "--quiet",
  "update-deps",
  "--validate",
]
language = "system"
files = '^(\.updatecli|static/updatecli)/'
pass_filenames = false

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rumdl-check"
name = "rumdl check"
entry = "rumdl check"
language = "system"
types = ["markdown"]
require_serial = true

[[repos]]
repo = "local"

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
entry = "shellcheck"
args = [
  "-x",
  "--source-path=SCRIPTDIR/../..",
  "--exclude=SC1091",
]
language = "system"
types = ["shell"]
exclude_types = ["zsh"]
require_serial = true

[[repos]]
repo = "local"

[[repos.hooks]]
id = "shfmt"
name = "shfmt"
entry = "shfmt"
args = ["--write"]
language = "system"
types = ["shell"]
exclude_types = ["csh", "tcsh"]
stages = ["pre-commit", "pre-merge-commit", "pre-push", "manual"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cog-check"
name = "cog check"
entry = "cog"
args = ["check", "--from-latest-tag"]
language = "system"
pass_filenames = false
stages = ["pre-push"]
