{{- range $i, $dep := .templateTools }}
{{- if $i }}
---
{{- end }}
name: "Bump {{ $dep.slug }} in the templates"

scms:
  default:
    kind: github
    spec:
      owner: "{{ $.github.owner }}"
      repository: "{{ $.github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: "{{ $.github.branch }}"
      commitusingapi: true
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true

sources:
  tool:
    name: "Get latest {{ $dep.slug }}"
    kind: {{ $dep.kind }}
    spec:
  {{- if eq $dep.kind "githubrelease" }}
      owner: {{ $dep.owner }}
      repository: {{ $dep.repo }}
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
    {{- if $dep.versionfilterRegex }}
        kind: regex/semver
        regex: '{{ $dep.versionfilterRegex }}'
        pattern: '*'
    {{- else }}
        kind: semver
    {{- end }}
  {{- else if eq $dep.kind "pypi" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: pep440
  {{- else if eq $dep.kind "npm" }}
      name: '{{ $dep.name }}'
      versionfilter:
        kind: semver
  {{- else if eq $dep.kind "cargopackage" }}
      package: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- else if eq $dep.kind "dockerimage" }}
      image: {{ $dep.image }}
      tagfilter: '{{ $dep.tagfilter }}'
      versionfilter:
        kind: semver
  {{- end }}
  {{- if or $dep.versionfilterRegex $dep.trimPrefix }}
    transformers:
  {{- if $dep.versionfilterRegex }}
      - findsubmatch:
          pattern: '{{ $dep.versionfilterRegex }}'
          captureindex: 1
  {{- end }}
  {{- if $dep.trimPrefix }}
      - trimprefix: "v"
  {{- end }}
  {{- end }}

targets:
{{- range $j, $target := $dep.targets }}
  tool{{ $j }}:
    name: "Update {{ $dep.slug }} in {{ $target.file }}"
    kind: file
    scmid: default
    sourceid: tool
    spec:
      file: {{ $target.file }}
      matchpattern: '(?m)({{ $target.prefix }})[0-9A-Za-z][0-9A-Za-z.+-]*'
      replacepattern: '${1}{{ "{{" }} source "tool" {{ "}}" }}'
{{- end }}

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): bump {{ $dep.slug }} to {{ "{{" }} source "tool" {{ "}}" }} in the templates'
    spec:
      labels:
        - dependencies
{{- end }}
