{{- /* dprintPlugins maps each template to the dprint plugins pinned in its
  static/dprint/<template>.json. */}}
{{- $first := true }}
{{- range $template, $deps := .dprintPlugins }}
{{- range $dep := $deps }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
{{- $file := printf "static/dprint/%s.json" $template }}
name: "Bump the {{ $dep.slug }} dprint plugin in {{ $file }}"

scms:
  default:
    kind: github
    spec:
      owner: "{{ $.github.owner }}"
      repository: "{{ $.github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: "{{ $.github.branch }}"
      commitusingapi: true
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true

sources:
  {{ $dep.slug }}:
    name: "Get latest {{ $dep.slug }} dprint plugin release"
    kind: githubrelease
    spec:
      owner: {{ $dep.owner }}
      repository: {{ $dep.repo }}
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
    transformers:
      - trimprefix: "v"

targets:
  {{ $dep.slug }}:
    name: "Update the {{ $dep.slug }} dprint plugin in {{ $file }}"
    kind: file
    scmid: default
    sourceid: {{ $dep.slug }}
    spec:
      file: {{ $file }}
      matchpattern: '("https://plugins\.dprint\.dev/{{ $dep.urlPrefix }})[^"]*(\.wasm")'
      replacepattern: '${1}{{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}${2}'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): bump the {{ $dep.slug }} dprint plugin to {{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}'
    spec:
      labels:
        - dependencies
{{- end }}
{{- end }}
