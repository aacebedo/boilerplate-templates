{{- /* miseDeps maps each template to its tools, one values file per template
  (.updatecli/values.yaml for base, .updatecli/values.d/<template>.yaml for the
  others): updatecli merges maps across values files but would replace a list. */}}
{{- $first := true }}
{{- range $template, $deps := .miseDeps }}
{{- range $dep := $deps }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
{{- $file := ".mise/conf.d/00-base.toml" }}
{{- if $dep.file }}{{ $file = $dep.file }}{{ end }}
name: "Bump {{ $dep.slug }} version in {{ $file }}"

scms:
  default:
    kind: github
    spec:
      owner: "{{ $.github.owner }}"
      repository: "{{ $.github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: "{{ $.github.branch }}"
      commitusingapi: true

sources:
  {{ $dep.slug }}:
    name: "Get latest {{ $dep.slug }} release"
    kind: {{ $dep.kind }}
    spec:
  {{- if eq $dep.kind "githubrelease" }}
      owner: {{ $dep.owner }}
      repository: {{ $dep.repo }}
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
    {{- if $dep.versionfilterRegex }}
        kind: regex/semver
        regex: '{{ $dep.versionfilterRegex }}'
        pattern: '*'
    {{- else }}
        kind: semver
    {{- end }}
  {{- else if eq $dep.kind "pypi" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: pep440
  {{- else if eq $dep.kind "npm" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- else if eq $dep.kind "cargopackage" }}
      package: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- end }}
  {{- if or $dep.versionfilterRegex $dep.trimPrefix }}
    transformers:
  {{- if $dep.versionfilterRegex }}
      - findsubmatch:
          pattern: '{{ $dep.versionfilterRegex }}'
          captureindex: 1
  {{- end }}
  {{- if $dep.trimPrefix }}
      - trimprefix: "v"
  {{- end }}
  {{- end }}
{{- $answers := ".boilerplate-answers.yaml" }}
{{- if $dep.answerKey }}

conditions:
  answerRecorded:
    name: "{{ $dep.answerKey }} is recorded in {{ $answers }}"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: {{ $answers }}
      matchpattern: '(?m)^{{ $dep.answerKey }}: '
{{- end }}

targets:
  {{ $dep.slug }}:
    name: "Update {{ $dep.slug }} in {{ $file }}"
    kind: file
    scmid: default
    sourceid: {{ $dep.slug }}
    disableconditions: true
    spec:
      file: {{ $file }}
  {{- if $dep.inlineTable }}
      matchpattern: '(?m)^({{ $dep.tomlKey }} = \{ version = )"[^"]*"'
      replacepattern: '${1}"{{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}"'
  {{- else }}
      matchpattern: '(?m)^{{ $dep.tomlKey }} = ".*"$'
      replacepattern: '{{ $dep.tomlKey }} = "{{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}"'
  {{- end }}
  {{- if $dep.answerKey }}
  {{ $dep.slug }}Answer:
    name: "Update {{ $dep.answerKey }} in {{ $answers }}"
    kind: file
    scmid: default
    sourceid: {{ $dep.slug }}
    spec:
      file: {{ $answers }}
      matchpattern: '(?m)^({{ $dep.answerKey }}: ).*$'
      replacepattern: '${1}''{{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}'''
  {{- end }}

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): bump {{ $dep.slug }} to {{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}'
    spec:
      labels:
        - dependencies
{{- end }}
{{- end }}
