{{- range $i, $dep := .templateDefaults }}
{{- if $i }}
---
{{- end }}
{{- $file := printf "templates/%s/boilerplate.yml" $dep.template }}
name: "Bump {{ $dep.variable }} default in {{ $file }}"

scms:
  default:
    kind: github
    spec:
      owner: "{{ $.github.owner }}"
      repository: "{{ $.github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      branch: "{{ $.github.branch }}"
      commitusingapi: true
      commitmessage:
        type: chore
        scope: deps
        hidecredit: true

sources:
  {{ $dep.variable }}:
    name: "Get latest {{ $dep.variable }}"
    kind: {{ $dep.kind }}
    spec:
  {{- if eq $dep.kind "githubrelease" }}
      owner: {{ $dep.owner }}
      repository: {{ $dep.repo }}
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
    {{- if $dep.versionfilterRegex }}
        kind: regex/semver
        regex: '{{ $dep.versionfilterRegex }}'
        pattern: '*'
    {{- else }}
        kind: semver
    {{- end }}
  {{- else if eq $dep.kind "pypi" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: pep440
  {{- else if eq $dep.kind "npm" }}
      name: '{{ $dep.name }}'
      versionfilter:
        kind: semver
  {{- else if eq $dep.kind "cargopackage" }}
      package: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- else if eq $dep.kind "dockerimage" }}
      image: {{ $dep.image }}
      tagfilter: '{{ $dep.tagfilter }}'
      versionfilter:
        kind: semver
  {{- end }}
  {{- if or $dep.versionfilterRegex $dep.trimPrefix }}
    transformers:
  {{- if $dep.versionfilterRegex }}
      - findsubmatch:
          pattern: '{{ $dep.versionfilterRegex }}'
          captureindex: 1
  {{- end }}
  {{- if $dep.trimPrefix }}
      - trimprefix: "v"
  {{- end }}
  {{- end }}

targets:
  {{ $dep.variable }}:
    name: "Update the {{ $dep.variable }} default in {{ $file }}"
    kind: file
    scmid: default
    sourceid: {{ $dep.variable }}
    spec:
      file: {{ $file }}
      matchpattern: '(?m)^(  - name: {{ $dep.variable }}\n(?:    .*\n)*?    default: )"[^"]*"'
      replacepattern: '${1}"{{ "{{" }} source "{{ $dep.variable }}" {{ "}}" }}"'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: >-
      chore(deps): bump {{ $dep.template }} {{ $dep.variable }} default to
      {{ "{{" }} source "{{ $dep.variable }}" {{ "}}" }}
    spec:
      labels:
        - dependencies
{{- end }}
