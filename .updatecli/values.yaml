---
github:
  owner: aacebedo
  repository: boilerplate-templates
  branch: main

templateDefaults:
  # --- base: mise tools ---
  - template: base
    variable: shellcheck_version
    kind: githubrelease
    owner: koalaman
    repo: shellcheck
    trimPrefix: true
  - template: base
    variable: editorconfig_checker_version
    kind: githubrelease
    owner: editorconfig-checker
    repo: editorconfig-checker
    trimPrefix: true
  - template: base
    variable: trivy_version
    kind: githubrelease
    owner: aquasecurity
    repo: trivy
    trimPrefix: true
  - template: base
    variable: ryl_version
    kind: githubrelease
    owner: owenlamont
    repo: ryl
    trimPrefix: true
  - template: base
    variable: prek_version
    kind: githubrelease
    owner: j178
    repo: prek
    trimPrefix: true
  - template: base
    variable: shfmt_version
    kind: githubrelease
    owner: mvdan
    repo: sh
    trimPrefix: true
  - template: base
    variable: dprint_version
    kind: githubrelease
    owner: dprint
    repo: dprint
    trimPrefix: true
  - template: base
    variable: tombi_version
    kind: githubrelease
    owner: tombi-toml
    repo: tombi
    trimPrefix: true
  - template: base
    variable: cocogitto_version
    kind: githubrelease
    owner: cocogitto
    repo: cocogitto
    trimPrefix: true
  - template: base
    variable: gh_version
    kind: githubrelease
    owner: cli
    repo: cli
    trimPrefix: true
  - template: base
    variable: rumdl_version
    kind: githubrelease
    owner: rvben
    repo: rumdl
    trimPrefix: true
  - template: base
    variable: updatecli_version
    kind: githubrelease
    owner: updatecli
    repo: updatecli
    trimPrefix: true
  - template: base
    variable: biome_version
    kind: githubrelease
    owner: biomejs
    repo: biome
    versionfilterRegex: '@biomejs/biome@(\d+\.\d+\.\d+)'
  - template: base
    variable: codebook_version
    kind: githubrelease
    owner: blopker
    repo: codebook
    trimPrefix: true
  - template: base
    variable: uv_version
    kind: pypi
    name: uv
  - template: base
    variable: reuse_version
    kind: pypi
    name: reuse
  - template: base
    variable: boilerplate_version
    kind: githubrelease
    owner: gruntwork-io
    repo: boilerplate
    trimPrefix: true
  - template: base
    variable: yq_version
    kind: githubrelease
    owner: mikefarah
    repo: yq
    trimPrefix: true
  # --- base: CI ---
  - template: base
    variable: devcontainer_image_version
    kind: dockerimage
    image: ghcr.io/aacebedo/devcontainer-base
    tagfilter: '^\d+\.\d+\.\d+$'
  # --- rust ---
  - template: rust
    variable: rust_version
    kind: githubrelease
    owner: rust-lang
    repo: rust
  # --- python ---
  - template: python
    variable: python_version
    kind: githubrelease
    owner: python
    repo: cpython
    trimPrefix: true
  - template: python
    variable: ruff_version
    kind: pypi
    name: ruff
  - template: python
    variable: pytest_version
    kind: pypi
    name: pytest
  # --- hugo ---
  - template: hugo
    variable: hugo_version
    kind: githubrelease
    owner: gohugoio
    repo: hugo
    trimPrefix: true
  - template: hugo
    variable: go_version
    kind: githubrelease
    owner: golang
    repo: go
    versionfilterRegex: '^go(\d+\.\d+\.\d+)$'
  - template: hugo
    variable: node_version
    kind: githubrelease
    owner: nodejs
    repo: node
    versionfilterRegex: '^v(26\.\d+\.\d+)$'
  - template: hugo
    variable: djlint_version
    kind: pypi
    name: djlint
  - template: hugo
    variable: lighthouse_version
    kind: npm
    name: lighthouse
  - template: hugo
    variable: puppeteer_version
    kind: npm
    name: puppeteer
  # --- container ---
  - template: container
    variable: hadolint_version
    kind: githubrelease
    owner: hadolint
    repo: hadolint
    trimPrefix: true

dprintPlugins:
  base:
    - slug: json
      owner: dprint
      repo: dprint-plugin-json
      urlPrefix: json-
    - slug: markdown
      owner: dprint
      repo: dprint-plugin-markdown
      urlPrefix: markdown-
    - slug: toml
      owner: dprint
      repo: dprint-plugin-toml
      urlPrefix: toml-
    - slug: prettyYaml
      owner: g-plane
      repo: pretty_yaml
      urlPrefix: g-plane/pretty_yaml-v
  container:
    - slug: dockerfile
      owner: dprint
      repo: dprint-plugin-dockerfile
      urlPrefix: dockerfile-
  hugo:
    - slug: gofumpt
      owner: jakebailey
      repo: dprint-plugin-gofumpt
      urlPrefix: jakebailey/gofumpt-v
    - slug: typescript
      owner: dprint
      repo: dprint-plugin-typescript
      urlPrefix: typescript-
    - slug: malva
      owner: g-plane
      repo: malva
      urlPrefix: g-plane/malva-v
    - slug: markupFmt
      owner: g-plane
      repo: markup_fmt
      urlPrefix: g-plane/markup_fmt-v
  python:
    - slug: ruff
      owner: dprint
      repo: dprint-plugin-ruff
      urlPrefix: ruff-
